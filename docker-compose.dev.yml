services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: paulette-dev:latest
    container_name: paulette-backend-dev
    working_dir: /workspace/backend
    command: air
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      REGISTRY_PATH: /home/paulette/.paulette
      REPOS_PATH: /home/paulette/repos
      CLAUDE_PATH: claude
      HOME: /home/paulette
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      # Source — changes on host are picked up by air immediately
      - ./backend:/workspace/backend
      # Go module cache — avoids re-downloading modules on each restart
      - go-mod-cache:/home/paulette/go/pkg/mod
      # Runtime persistence — named volumes, same as docker-compose.yml
      - registry-data:/home/paulette/.paulette
      - repos-data:/home/paulette/repos
      # Mount the paulette repo itself as a project in repos (dev only)
      - ./:/home/paulette/repos/paulette
      # Shared beads DB — same named volume as docker-compose.yml (paulette_beads-data)
      - beads-data:/home/paulette/.beads
      # Mount host Claude credentials so OAuth login works without going through
      # the container (Cloudflare blocks docker IPs on the token exchange endpoint).
      # Run `claude auth login` on your host machine once, then restart dev containers.
      - ${USERPROFILE:-${HOME}}/.claude/.credentials.json:/home/paulette/.claude/.credentials.json:ro

  frontend:
    image: node:22-bookworm-slim
    container_name: paulette-frontend-dev
    working_dir: /workspace/frontend
    # --host makes Vite listen on 0.0.0.0 so the port is reachable from the host
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      # Overrides the proxy target in vite.config.ts for the Docker network
      BACKEND_URL: "http://backend:8080"
      # Polling fallback — required on Windows where inotify events don't
      # cross the host→container boundary reliably
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    volumes:
      # Source — Vite HMR watches for changes
      - ./frontend:/workspace/frontend
      # Isolated node_modules inside the container (avoids Windows path issues)
      - frontend-node-modules:/workspace/frontend/node_modules
    depends_on:
      - backend

volumes:
  # Shared with docker-compose.yml (same Docker project name = paulette_*)
  beads-data:
  registry-data:
  repos-data:
  # Dev-only
  go-mod-cache:
  frontend-node-modules:
